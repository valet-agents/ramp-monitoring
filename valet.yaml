name: ramp-monitoring
display_name: Ramp Monitoring
description: >-
  Every day, reviews the day's Ramp purchases against your
  approved-vendor list — flags anything off-contract, duplicate,
  high-value, or out-of-policy in your procurement channel.
category: procurement

story:
  hero: "Catch off-contract spend the moment it happens."
  subheadline: >-
    Every day, the day's Ramp purchases get checked against your
    approved-vendor list — anything off-contract, duplicate, or
    out-of-policy is flagged.
  steps:
    - role: trigger
      title: "Every morning."
      body: >-
        The heartbeat fires once a day. The agent reviews every
        Ramp purchase that posted since the last run.
    - role: action
      title: "It checks the merchant against your approved-vendor list."
      body: >-
        Classifies each new charge — approved, unrecognized,
        duplicate, high-value, or policy-flag — against the
        vendor list you configure.
      catalog: ramp-mcp
    - role: outcome
      title: "Anomalies flagged in Slack."
      body: >-
        One card per non-approved charge — amount, merchant,
        cardholder, suggested action, Ramp link. Approved
        charges stay silent.
      catalog: slack

connectors:
  - catalog: ramp-mcp
    description: >-
      The Ramp MCP server. The agent reads card transactions
      to classify each new charge against your approved-vendor
      list, and (only when explicitly asked and confirmed in
      Slack) approves or rejects them. OAuth — no API token to
      paste.
    ui:
      headline: "Connect Ramp with one click."
      blurb: >-
        OAuth into Ramp — no API client ID or secret to paste.
        The agent reads transactions and posts anomaly cards;
        approvals only happen when you ask and confirm in Slack.
      done_note: "Ramp connected"

channels:
  - catalog: slack
    description: >-
      The agent gets its own Slack bot. Invite it to
      `#procurement` (or wherever you want spend flags to
      land), and to any channel where teammates should be
      able to @mention it for ad-hoc spend questions.
    ui:
      headline: "Give Ramp Monitoring a Slack bot."
      blurb: >-
        The agent posts one card per off-contract,
        duplicate, or high-value charge to whichever channel
        you invite it to. Approved charges stay silent —
        invite it to a focused finance or procurement channel.
      done_note: "Bot ready — invite it to #procurement"

  - type: heartbeat
    every: 24h
    description: "Polls Ramp once a day for new transactions to classify and flag."
